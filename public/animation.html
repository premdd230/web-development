<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container_bouncing_ball{
            height: 100vh;
            width: 100vw;
            border-bottom: 50px solid orangered;
            position: relative;
        }
        .round{
            height: 100px;
            width: 100px;
            border-radius: 50%;
            background-color:orangered;
            position: absolute;
            bottom: 10%;
            left: 10%;
            animation: bounce 5s infinite;
        }
        @keyframes bounce{
            0%{
                bottom: 10%;
                background-color:dodgerblue;
                transform: scaleY(1);
            }
            25%{    
                bottom: 50%;
                left: 25%;
                background-color:dodgerblue;
                transform: scaleY(1.2);
            }
            50%{
                bottom: 10%;
                left: 50%;
                background-color:dodgerblue;
                transform: scalex(1.3);
            }
            75%{
                bottom: 50%;
                left: 75%;
                background-color:dodgerblue;
                transform: scaleY(1.2);
            }
            100%{
                bottom: 10%;
                left: 90%;
                background-color:dodgerblue;
                transform: scalex(1.3);
            }
        }

    </style>
</head>
<body>
    <div class="container_bouncing_ball">
        <div class="ball">
            <div class="round"></div>
        </div>

    </div>
</body>
</html>
