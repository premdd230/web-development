<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transaction</title>
    <style>
        .div{
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background-color: blueviolet;
            /* transition: height 3s, width 3s, background-color 3s; */
            transition-property: width, height;
            transition-duration: 3000ms;

            transition-timing-function: ease;
            transition-delay: 3s;
            
        }
        .div:hover{
            height: 200px;
            width: 200px;
            background-color: blue;
            
        }
        .a{
            position: relative;
            display: inline-block;
            cursor: pointer;
        }
        .span{
            visibility: hidden;
            width: 120px;
            background-color: black;
            color: white;
            border-radius: 5px;
            text-align: center;
            padding: 5px 0px;
            position: absolute;
            z-index: 1;
            left: 35px;

        }
        .a:hover .span {
            visibility: visible;

        }
        .ball{
            height: 100px;
            width: 100px;
            border: 1px solid black;
            border-radius: 50%;
            background-color:rgba(221, 10, 10, 0.5);
            animation-name: prem;
            animation-duration: 5s;
            position: relative;
            animation-iteration-count: 2;
            /* animation-direction: reverse; */
            animation-fill-mode: forwards;
            animation-play-state: paused;
        }


        @keyframes prem{
            0%{
                background-color: blueviolet;
                top: 0;
                animation-timing-function: ease-out;
            }
            25%{
                background-color: dodgerblue;
                top: 100px;
                animation-timing-function: ease-in;

            }
            50%{
                background-color: orange;
                top: 200px;
                animation-timing-function: ease-in;
            }
            75%{
                background-color: greenyellow;
                top: 100px;
                animation-timing-function: ease-in;
            }
            100%{
                background-color: aquamarine;
                top: 0;
                animation-timing-function: ease-out;
            }
        }

        .container > a{
            text-decoration: none;
            border: 1px solid black;
            /* padding: 3px 20px; */
            background-color: dodgerblue;
            border-radius: 5px;
            /* flex-grow: 1; */
            text-align: center;
            margin-right: 5px;
            
        }
        .container > a:nth-of-type(1){
            flex-grow: 1;
        }
        .container > a:nth-of-type(2){
            flex-grow: 1;
        }
        .container > a:nth-of-type(3){
            flex-grow: 2;
        }
        .container > a:nth-of-type(4){
            flex-grow: 2;
        }
        

        .container{
            height: 50vh;
            width: 50vw;
            background-color: aquamarine;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>
</head>
<body>
    <div class="div">
        transition-property
    </div>

    <a class="a" href="">Tool_tip<span class="span">PREMKUMAR</span></a>
    <h1>bouncing bal</h1>
    <div class="ball">

    </div>

    <div class="container">
        <a href="">previous</a>
        <a href="">next</a>
        <a href="">2</a>
        <a href="">3</a>
    </div>



    
</body>
</html>
